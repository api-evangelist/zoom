                - uuid: unique_id
                  id: '123456789'
                  host: Zoomie Userton
                  email: email_address
                  user_type: ''
                  start_time: ''
                  end_time: ''
                  duration: ''
                  participants: 1
                  has_pstn: false
                  has_voip: false
                  has_3rd_party_audio: false
                  has_video: false
                  has_screen_share: false

  /metrics/zoomroomdetail:
    post:
      tags:
      - Dashboard
      description: Get a Zoom Room on Zoom via Zoom ID, return the Zoom Room info.
      operationId: dashboardZoomroomdetail
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
              - from
              - id
              - to
              type: object
              properties:
                id:
                  type: string
                  description: 'The zoom room ID. Example: ucc69C82Q5mTNyCRWE29Aw== Or B9C73AF4-2F36-4399-9337-2091584DBD03'
                from:
                  type: string
                  description: Start date.
                to:
                  type: string
                  description: End date.
                page_size:
                  type: string
                  description: The amount of records returns within a single API call. Defaults to 30. Max of 30 records.
                  default: '30'
                page_number:
                  type: string
                  description: Current page number of returned records. Default to 1.
                  default: '1'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                from: 2016-04-12
                to: 2016-04-13
                page_count: 1
                page_number: 1
                page_size: 30
                total_records: 1
                zoom_room:
